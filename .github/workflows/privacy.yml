name: Privacy

on:
  pull_request:
    paths:
      - ".github/workflows/privacy.yml"
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decoy-rotation:
    name: Decoy rotation and evidence scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        timeout-minutes: 10
        run: npm ci

      - name: Install browser system dependencies
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      - name: Validate evidence scanner
        working-directory: frontend
        timeout-minutes: 2
        run: npm run privacy:evidence:test

      - name: Run privacy matrix with rotated decoys
        working-directory: frontend
        timeout-minutes: 20
        run: npm run privacy:matrix
