name: Backend

on:
  pull_request:
    paths:
      - ".github/workflows/backend.yml"
      - "backend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend.yml"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Run backend race tests
        working-directory: backend
        run: go test -race ./...

      - name: Validate control contract
        run: ./scripts/check-control-contract.sh
